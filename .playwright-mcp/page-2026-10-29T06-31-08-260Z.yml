            - generic [ref=f2e61]: Test Design
            - heading "Write Atomic & Independent Tests" [level=3] [ref=f2e68]
            - paragraph [ref=f2e69]: Each test should focus on a single feature and be able to run independently in any order without relying on previous test state.
          - generic [ref=f2e70]:
            - generic [ref=f2e71]: Performance
            - heading "Avoid Static Waits (Sleeps)" [level=3] [ref=f2e77]
            - paragraph [ref=f2e78]: Replace hardcoded timeouts like sleep(5000) with dynamic or explicit waits (e.g., waitForSelector) to make suites faster and less flaky.
          - generic [ref=f2e79]:
            - generic [ref=f2e80]: Stability
            - heading "Use Resilient Element Selectors" [level=3] [ref=f2e87]
            - paragraph [ref=f2e88]: Avoid fragile XPaths or dynamic class names. Prefer dedicated test attributes like data-testid or user-visible roles (ARIA).
          - generic [ref=f2e89]:
            - generic [ref=f2e90]: Maintainability
            - heading "Adopt Design Patterns (e.g. POM)" [level=3] [ref=f2e97]
            - paragraph [ref=f2e98]: Use patterns like Page Object Model (POM) or Component Objects to decouple UI selectors from your actual test assertions.
          - generic [ref=f2e99]:
            - generic [ref=f2e100]: DevOps
            - heading "Integrate Early in CI/CD Pipelines" [level=3] [ref=f2e107]
            - paragraph [ref=f2e108]: Run automated smoke tests on every Pull Request. Catch bugs early before they reach staging or production environments.
          - generic [ref=f2e109]:
            - generic [ref=f2e110]: Quality
            - heading "Treat Test Code like Production Code" [level=3] [ref=f2e116]
            - paragraph [ref=f2e117]: Apply code reviews, DRY principles, and regular refactoring to your test scripts to keep your test codebase clean and sustainable.