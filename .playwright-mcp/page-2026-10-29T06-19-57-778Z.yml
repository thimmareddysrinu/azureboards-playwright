            - generic [ref=f1e61]: Test Design
            - heading "Write Atomic & Independent Tests" [level=3] [ref=f1e68]
            - paragraph [ref=f1e69]: Each test should focus on a single feature and be able to run independently in any order without relying on previous test state.
          - generic [ref=f1e70]:
            - generic [ref=f1e71]: Performance
            - heading "Avoid Static Waits (Sleeps)" [level=3] [ref=f1e77]
            - paragraph [ref=f1e78]: Replace hardcoded timeouts like sleep(5000) with dynamic or explicit waits (e.g., waitForSelector) to make suites faster and less flaky.
          - generic [ref=f1e79]:
            - generic [ref=f1e80]: Stability
            - heading "Use Resilient Element Selectors" [level=3] [ref=f1e87]
            - paragraph [ref=f1e88]: Avoid fragile XPaths or dynamic class names. Prefer dedicated test attributes like data-testid or user-visible roles (ARIA).
          - generic [ref=f1e89]:
            - generic [ref=f1e90]: Maintainability
            - heading "Adopt Design Patterns (e.g. POM)" [level=3] [ref=f1e97]
            - paragraph [ref=f1e98]: Use patterns like Page Object Model (POM) or Component Objects to decouple UI selectors from your actual test assertions.
          - generic [ref=f1e99]:
            - generic [ref=f1e100]: DevOps
            - heading "Integrate Early in CI/CD Pipelines" [level=3] [ref=f1e107]
            - paragraph [ref=f1e108]: Run automated smoke tests on every Pull Request. Catch bugs early before they reach staging or production environments.
          - generic [ref=f1e109]:
